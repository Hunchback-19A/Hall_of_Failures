[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "megadatetime"
version = "0.2.0"
description = "A learning-oriented extension of Python's datetime with a much larger year range."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MegaDateTime Contributors" }]
keywords = ["datetime", "calendar", "gregorian", "education", "iers", "earth-orientation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
# certifi improves HTTPS on some platforms; not required if your CA store already works.
network = ["certifi>=2023.0.0"]
dev = ["pytest>=7.0", "certifi>=2023.0.0"]
viewer = ["pyvista>=0.43", "numpy>=1.22", "Pillow>=9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["megadatetime*", "EarthViewer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
